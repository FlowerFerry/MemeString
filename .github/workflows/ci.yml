name: CI

on:
  push:
  pull_request:

jobs:
  linux-gcc-x64:
    name: Linux (GCC x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMEMESTRING_UNITTEST_ENABLE=ON
          -DMEMESTRING_TEST_ENABLE=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build

  linux-clang-x64:
    name: Linux (Clang x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang and Ninja
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DMEMESTRING_UNITTEST_ENABLE=ON
          -DMEMESTRING_TEST_ENABLE=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build

  windows-msvc-x64:
    name: Windows (MSVC x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build -G "Visual Studio 17 2022" -A x64
          -DMEMESTRING_UNITTEST_ENABLE=ON
          -DMEMESTRING_TEST_ENABLE=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  windows-msvc-x86:
    name: Windows (MSVC x86)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build -G "Visual Studio 17 2022" -A Win32
          -DMEMESTRING_UNITTEST_ENABLE=ON
          -DMEMESTRING_TEST_ENABLE=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  linux-clang-x86:
    name: Linux (Clang x86)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build gcc-multilib g++-multilib

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_FLAGS=-m32
          -DCMAKE_CXX_FLAGS=-m32
          -DCMAKE_LIBRARY_PATH=/usr/lib32
          -DMEMESTRING_UNITTEST_ENABLE=ON
          -DMEMESTRING_TEST_ENABLE=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build

  linux-gcc-x86:
    name: Linux (GCC x86)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-multilib g++-multilib

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS=-m32
          -DCMAKE_CXX_FLAGS=-m32
          -DCMAKE_LIBRARY_PATH=/usr/lib32
          -DMEMESTRING_UNITTEST_ENABLE=ON
          -DMEMESTRING_TEST_ENABLE=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build

  linux-gcc-armv7l:
    name: Linux (GCC armv7l)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6-armhf-cross qemu-user

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=Linux
          -DCMAKE_SYSTEM_PROCESSOR=arm
          -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc
          -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++
          -DCMAKE_FIND_ROOT_PATH=/usr/arm-linux-gnueabihf
          -DMEMESTRING_UNITTEST_ENABLE=ON
          -DMEMESTRING_TEST_ENABLE=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 60
        env:
          QEMU_LD_PREFIX: /usr/arm-linux-gnueabihf

  linux-gcc-aarch64:
    name: Linux (GCC aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMEMESTRING_UNITTEST_ENABLE=ON
          -DMEMESTRING_TEST_ENABLE=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build

  linux-gcc-no-exceptions:
    name: Linux (GCC, exceptions disabled)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMEMESTRING_UNITTEST_ENABLE=ON
          -DMEMESTRING_TEST_ENABLE=ON
          -DMEMESTRING_DISABLE_EXCEPTIONS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build

  android-ndk:
    name: Android NDK (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android build tools
        run: |
          sdkmanager --install \
            "platforms;android-21" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Configure Android toolchain environment
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      - name: Configure Android NDK
        env:
          ABI: ${{ matrix.abi }}
        run: >
          cmake -S . -B "build/android-${ABI}" -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI="${ABI}"
          -DANDROID_PLATFORM=android-21
          -DMEMESTRING_BENCHMARK_ENABLE=OFF
          -DMEMESTRING_TEST_ENABLE=OFF
          -DMEMESTRING_UNITTEST_ENABLE=OFF

      - name: Build Android shared library
        env:
          ABI: ${{ matrix.abi }}
        run: cmake --build "build/android-${ABI}" --parallel

      - name: Validate Android shared library
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euxo pipefail
          library=$(find "build/android-${ABI}" -type f -name 'libmeme_string.so' -print -quit)
          test -n "$library"
          file "$library"
          readelf="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$readelf"
          header=$("$readelf" -h "$library")
          printf '%s\n' "$header"
          case "$ABI" in
            arm64-v8a) expected_machine='AArch64' ;;
            armeabi-v7a) expected_machine='ARM' ;;
            *) echo "Unsupported ABI: $ABI" >&2; exit 1 ;;
          esac
          printf '%s\n' "$header" | grep -F "Machine: $expected_machine"
          symbols=$("$readelf" --dyn-syms "$library" | grep -E 'MemeString_|mmutf_' || true)
          printf '%s\n' "$symbols" | awk 'NR <= 40'
          test -n "$symbols"

      - name: Upload Android shared library
        uses: actions/upload-artifact@v4
        with:
          name: memestring-android-${{ matrix.abi }}
          path: build/android-${{ matrix.abi }}/**/libmeme_string.so
          if-no-files-found: error
