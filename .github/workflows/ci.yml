name: CI

on:
  push:
  pull_request:

jobs:
  linux-gcc-x64:
    name: Linux (GCC x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMEMESTRING_UNITTEST_ENABLE=ON
          -DMEMESTRING_TEST_ENABLE=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build

  linux-clang-x64:
    name: Linux (Clang x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang and Ninja
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DMEMESTRING_UNITTEST_ENABLE=ON
          -DMEMESTRING_TEST_ENABLE=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build

  windows-msvc-x64:
    name: Windows (MSVC x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build -G "Visual Studio 17 2022" -A x64
          -DMEMESTRING_UNITTEST_ENABLE=ON
          -DMEMESTRING_TEST_ENABLE=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  windows-msvc-x86:
    name: Windows (MSVC x86)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build -G "Visual Studio 17 2022" -A Win32
          -DMEMESTRING_UNITTEST_ENABLE=ON
          -DMEMESTRING_TEST_ENABLE=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  linux-clang-x86:
    name: Linux (Clang x86)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build gcc-multilib g++-multilib

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_FLAGS=-m32
          -DCMAKE_CXX_FLAGS=-m32
          -DMEMESTRING_UNITTEST_ENABLE=ON
          -DMEMESTRING_TEST_ENABLE=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build

  linux-gcc-x86:
    name: Linux (GCC x86)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-multilib g++-multilib

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS=-m32
          -DCMAKE_CXX_FLAGS=-m32
          -DMEMESTRING_UNITTEST_ENABLE=ON
          -DMEMESTRING_TEST_ENABLE=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build

  linux-gcc-armv7l:
    name: Linux (GCC armv7l)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf qemu-user

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=Linux
          -DCMAKE_SYSTEM_PROCESSOR=arm
          -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc
          -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++
          -DCMAKE_FIND_ROOT_PATH=/usr/arm-linux-gnueabihf
          -DMEMESTRING_UNITTEST_ENABLE=ON
          -DMEMESTRING_TEST_ENABLE=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: >
          ctest --test-dir build --output-on-failure
          --test-command-prefix "qemu-arm-static -L /usr/arm-linux-gnueabihf"
          --timeout 60

  linux-gcc-aarch64:
    name: Linux (GCC aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMEMESTRING_UNITTEST_ENABLE=ON
          -DMEMESTRING_TEST_ENABLE=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build
